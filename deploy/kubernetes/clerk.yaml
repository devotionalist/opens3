apiVersion: v1
kind: Service
metadata:
  name: opens3-clerk-hl
  namespace: opens3
  labels:
    app.kubernetes.io/name: opens3
    app.kubernetes.io/component: clerk
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 9333
      targetPort: 9333
  selector:
    app.kubernetes.io/name: opens3
    app.kubernetes.io/component: clerk
---
apiVersion: v1
kind: Service
metadata:
  name: opens3-clerk
  namespace: opens3
  labels:
    app.kubernetes.io/name: opens3
    app.kubernetes.io/component: clerk
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9333
      targetPort: 9333
  selector:
    app.kubernetes.io/name: opens3
    app.kubernetes.io/component: clerk
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opens3-clerk
  namespace: opens3
  labels:
    app.kubernetes.io/name: opens3
    app.kubernetes.io/component: clerk
spec:
  serviceName: opens3-clerk-hl
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: opens3
      app.kubernetes.io/component: clerk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opens3
        app.kubernetes.io/component: clerk
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: clerk
                topologyKey: kubernetes.io/hostname
      containers:
        - name: clerk
          image: opens3:latest
          imagePullPolicy: IfNotPresent
          args:
            - clerk
            - --port=9333
            - --ip=$(POD_NAME)
            - --advertise-url=http://$(POD_NAME).opens3-clerk-hl.opens3.svc.cluster.local:9333
            - --peers=$(CLERK_PEERS)
            - --default-replication=$(DEFAULT_REPLICATION)
            - --raft-dir=/data/raft
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLERK_PEERS
              valueFrom:
                configMapKeyRef:
                  name: opens3-config
                  key: CLERK_PEERS
            - name: DEFAULT_REPLICATION
              valueFrom:
                configMapKeyRef:
                  name: opens3-config
                  key: DEFAULT_REPLICATION
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 9333
          volumeMounts:
            - name: raft
              mountPath: /data/raft
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: raft
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
