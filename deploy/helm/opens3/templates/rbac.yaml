apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opens3.fullname" . }}-filer
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: filer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opens3.fullname" . }}-filer-topo
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: filer
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale", "deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opens3.fullname" . }}-filer-topo
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: filer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opens3.fullname" . }}-filer-topo
subjects:
  - kind: ServiceAccount
    name: {{ include "opens3.fullname" . }}-filer
    namespace: {{ .Release.Namespace }}
---
# Cordon/list worker nodes when adding a data node onto a chosen machine.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opens3.fullname" . }}-filer-nodes
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: filer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opens3.fullname" . }}-filer-nodes
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: filer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opens3.fullname" . }}-filer-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "opens3.fullname" . }}-filer
    namespace: {{ .Release.Namespace }}
