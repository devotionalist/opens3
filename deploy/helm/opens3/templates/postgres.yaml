{{- if and .Values.filer.enabled (eq (.Values.filer.metaBackend | default "") "postgres") (.Values.filer.postgres.enabled | default false) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opens3.postgresSecret" . }}
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.filer.postgres.user | default "opens3" | quote }}
  POSTGRES_PASSWORD: {{ .Values.filer.postgres.password | default "opens3" | quote }}
  POSTGRES_DB: {{ .Values.filer.postgres.database | default "opens3" | quote }}
  DATABASE_URL: {{ include "opens3.filerDatabaseUrl" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opens3.postgresService" . }}
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "opens3.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opens3.fullname" . }}-postgres
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opens3.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opens3.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.filer.postgres.image | default "postgres:16-alpine" | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "opens3.postgresSecret" . }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.filer.postgres.user | default "opens3" | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.filer.postgres.user | default "opens3" | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml (.Values.filer.postgres.resources | default dict) | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.filer.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "opens3.fullname" . }}-postgres
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.filer.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opens3.fullname" . }}-postgres
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - {{ .Values.filer.postgres.persistence.accessMode | default "ReadWriteOnce" }}
  {{- if .Values.filer.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.filer.postgres.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.filer.postgres.persistence.size | default "10Gi" }}
{{- end }}
{{- end }}
