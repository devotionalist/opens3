{{- if and .Values.filer.enabled (eq (.Values.filer.metaBackend | default "") "postgres") (.Values.filer.postgres.enabled | default false) }}
{{- $pgPersist := .Values.filer.postgres.persistence | default dict -}}
{{- $pgPersistType := include "opens3.persistType" (dict "root" . "component" $pgPersist) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opens3.postgresSecret" . }}
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.filer.postgres.user | default "opens3" | quote }}
  POSTGRES_PASSWORD: {{ .Values.filer.postgres.password | default "opens3" | quote }}
  POSTGRES_DB: {{ .Values.filer.postgres.database | default "opens3" | quote }}
  DATABASE_URL: {{ include "opens3.filerDatabaseUrl" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opens3.postgresService" . }}
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "opens3.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opens3.fullname" . }}-postgres
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opens3.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opens3.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      {{- if and $pgPersist.enabled (eq $pgPersistType "hostPath") }}
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-hostpath
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /mnt/pgdata && chown -R 70:70 /mnt/pgdata"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /mnt
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.filer.postgres.image | default "postgres:16-alpine" | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "opens3.postgresSecret" . }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              {{- if and $pgPersist.enabled (eq $pgPersistType "hostPath") }}
              subPath: pgdata
              {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.filer.postgres.user | default "opens3" | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.filer.postgres.user | default "opens3" | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml (.Values.filer.postgres.resources | default dict) | nindent 12 }}
      volumes:
        - name: data
          {{- if not $pgPersist.enabled }}
          emptyDir: {}
          {{- else if eq $pgPersistType "hostPath" }}
          hostPath:
            path: {{ include "opens3.hostPath" (dict "root" . "component" "postgres") | quote }}
            type: DirectoryOrCreate
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "opens3.fullname" . }}-postgres
          {{- end }}
{{- if and $pgPersist.enabled (eq $pgPersistType "pvc") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opens3.fullname" . }}-postgres
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - {{ $pgPersist.accessMode | default "ReadWriteOnce" }}
  {{- if $pgPersist.storageClass }}
  storageClassName: {{ $pgPersist.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pgPersist.size | default "10Gi" }}
{{- end }}
{{- end }}
