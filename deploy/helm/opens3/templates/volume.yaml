apiVersion: v1
kind: Service
metadata:
  name: {{ include "opens3.volumeHeadless" . }}
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: volume
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.volume.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "opens3.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: volume
---
{{- $volumePersistType := include "opens3.persistType" (dict "root" . "component" .Values.volume.persistence) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opens3.fullname" . }}-volume
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: volume
spec:
  serviceName: {{ include "opens3.volumeHeadless" . }}
  replicas: {{ .Values.volume.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opens3.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: volume
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opens3.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: volume
    spec:
      {{- if .Values.volume.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: volume
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if and .Values.volume.persistence.enabled (eq $volumePersistType "hostPath") }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-hostpath
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /mnt/$(POD_NAME) && chown -R 10001:0 /mnt/$(POD_NAME)"]
          securityContext:
            runAsUser: 0
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /mnt
      {{- end }}
      containers:
        - name: volume
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - volume
            - --port={{ .Values.volume.port }}
            - --ip=$(POD_IP)
            - --node-id=$(POD_NAME)
            - --dir=/data/volumes
            - --clerk={{ include "opens3.clerkUrl" . }}
            - --data-center={{ .Values.dataCenter }}
            - --rack={{ .Values.rack }}
            - --max-volumes={{ .Values.volume.maxVolumes }}
            - --max-volume-size-mb={{ .Values.volume.maxVolumeSizeMb }}
            - --bootstrap-dir=/etc/opens3/volume-bootstrap
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPENS3_VOLUME_BOOTSTRAP_DIR
              value: /etc/opens3/volume-bootstrap
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: {{ .Values.volume.port }}
          volumeMounts:
            - name: data
              mountPath: /data/volumes
              {{- if and .Values.volume.persistence.enabled (eq $volumePersistType "hostPath") }}
              subPathExpr: $(POD_NAME)
              {{- end }}
            - name: volume-bootstrap
              mountPath: /etc/opens3/volume-bootstrap
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.volume.resources | nindent 12 }}
      volumes:
        - name: volume-bootstrap
          configMap:
            name: {{ include "opens3.fullname" . }}-volume-bootstrap
        {{- if or (not .Values.volume.persistence.enabled) (eq $volumePersistType "hostPath") }}
        - name: data
          {{- if not .Values.volume.persistence.enabled }}
          emptyDir: {}
          {{- else }}
          hostPath:
            path: {{ include "opens3.hostPath" (dict "root" . "component" "volume") | quote }}
            type: DirectoryOrCreate
          {{- end }}
        {{- end }}
  {{- if and .Values.volume.persistence.enabled (eq $volumePersistType "pvc") }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.volume.persistence.storageClass }}
        storageClassName: {{ .Values.volume.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.volume.persistence.size }}
  {{- end }}
