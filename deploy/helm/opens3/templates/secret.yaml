{{- if not .Values.filer.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opens3.fullname" . }}-filer-credentials
  labels:
    {{- include "opens3.labels" . | nindent 4 }}
    app.kubernetes.io/component: filer
type: Opaque
stringData:
  OPENS3_ACCESS_KEY: {{ .Values.filer.credentials.accessKey | quote }}
  OPENS3_SECRET_KEY: {{ .Values.filer.credentials.secretKey | quote }}
{{- end }}
