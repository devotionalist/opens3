# Lightweight overrides for kind / minikube / Colima / local clusters
# Usage (local image, no Hub pull):
#   docker build -t opens3:0.1.0 .
#   # Colima k3s: docker save opens3:0.1.0 | colima ssh -- sudo k3s ctr images import -
#   helm upgrade --install opens3 deploy/helm/opens3 -n opens3 --create-namespace \
#     -f deploy/helm/opens3/values-dev.yaml
# Inherits persistence.type=hostPath from values.yaml (data under /var/lib/opens3/...).
# Production / shared clusters: omit this file and use values.yaml + --set persistence.type=pvc.
image:
  repository: opens3
  tag: "0.1.0"
  pullPolicy: Never

defaultReplication: "000"

clerk:
  replicas: 3
  # Raft MUST survive pod restart; hostPath (default) or pvc — never long-lived emptyDir.
  persistence:
    enabled: true
  podAntiAffinity: false
  # Colima/local: clerk was still OOMKilled (137) at 1Gi during Raft bootstrap.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

volume:
  replicas: 2
  # One data volume per data node by default; raise to precreate a pool.
  maxVolumes: 1
  maxVolumeSizeMb: 1024
  startOnline: true
  # Example (commented): make volume-1 a replica of volume-0 at deploy time
  # replicaOf:
  #   "1": "0"
  persistence:
    enabled: true
  podAntiAffinity: false

filer:
  enabled: true
  replicas: 2
  port: 8333
  credentials:
    accessKey: admin
    secretKey: devsecretdevsecret
  metaBackend: postgres
  postgres:
    enabled: true
    persistence:
      enabled: true
  service:
    type: NodePort
    nodePort: 30333

